name: Build apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, arch: x64, target: --win, test: true }
          - { name: mac-intel, os: macos-15-intel, arch: x64, target: --mac, test: true }
          # Apple Silicon (M1/M2/M3/M4): compilata sul runner Intel, che ha code più brevi
          # (i binari arm64 non si possono eseguire su Intel: i test girano nel job test-apple-silicon)
          - { name: mac-apple-silicon, os: macos-15-intel, arch: arm64, target: --mac, test: false }
          - { name: linux-x64, os: ubuntu-latest, arch: x64, target: --linux, test: true }
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # npm_config_arch fa scaricare a ffmpeg-static il binario FFmpeg dell'architettura di destinazione
      - run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: FFmpeg di sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Test flussi (MP3, playlist PLS/M3U/ASX, HLS, ascolto)
        if: matrix.test
        run: npm test
      - run: npx electron-builder ${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Verifica app macOS (architettura e firma)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e +o pipefail
          APP=$(find dist -maxdepth 2 -name "*.app" | head -1)
          FF="$APP/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"
          WANT=$([ "${{ matrix.arch }}" = arm64 ] && echo arm64 || echo x86_64)
          APPARCH=$(lipo -archs "$APP/Contents/MacOS/MaxTrip Stream Monitor" 2>&1)
          FFARCH=$(lipo -archs "$FF" 2>&1)
          if SIGN=$(codesign --verify --deep --strict "$APP" 2>&1); then SIGNOK=1; SIGN=valid; else SIGNOK=0; SIGN=$(echo "$SIGN" | tr '\n' ' '); fi
          INFO=$(codesign -dv "$APP" 2>&1 | grep -E "Signature|TeamIdentifier|flags" | tr '\n' ' ')
          FFSIGN=$(codesign -dv "$FF" 2>&1 | grep -E "Signature|flags" | tr '\n' ' ')
          echo "::notice title=${{ matrix.name }}::app=$APP | app arch=$APPARCH | ffmpeg arch=$FFARCH | sign=$SIGN | $INFO | ffmpeg: $FFSIGN"
          ok=1
          [ "$APPARCH" = "$WANT" ] || { echo "::error title=${{ matrix.name }}::architettura app $APPARCH != $WANT"; ok=0; }
          [ "$FFARCH" = "$WANT" ] || { echo "::error title=${{ matrix.name }}::architettura ffmpeg $FFARCH != $WANT"; ok=0; }
          codesign --verify --strict "$FF" 2>/dev/null || { echo "::error title=${{ matrix.name }}::ffmpeg non firmato"; ok=0; }
          [ $SIGNOK = 1 ] || { echo "::error title=${{ matrix.name }}::firma non valida: $SIGN"; ok=0; }
          [ $ok = 1 ]
      - uses: actions/upload-artifact@v5
        with:
          name: stream-monitor-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  # ---------------- App Android ----------------
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Notifiche push Android: richiede il file google-services.json di Firebase (segreto GOOGLE_SERVICES_JSON)
      - name: Configurazione Firebase
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - run: npm run sync-ui && npx cap sync android && node scripts/patch-native.js
      - name: APK installabile
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      # Versione firmata per il Play Store (segreti ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)
      - name: AAB firmato per Google Play
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: mobile/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
      - name: Nomi dei file
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/MaxTrip-Stream-Monitor-$V-android.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab "out/MaxTrip-Stream-Monitor-$V-android-play.aab"; fi
          echo "::notice title=android::push Firebase $([ -f android/app/google-services.json ] && echo attive || echo 'non configurate (segreto GOOGLE_SERVICES_JSON mancante)')"
          ls -la out
      - uses: actions/upload-artifact@v5
        with:
          name: stream-monitor-android
          path: mobile/out/*
          if-no-files-found: error

  # ---------------- App iOS (verifica di compilazione) ----------------
  # Per installare l'app su iPhone serve la firma con un account Apple Developer (Xcode / TestFlight).
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run sync-ui && npx cap sync ios && node scripts/patch-native.js
      - name: Compilazione per iPhone (senza firma)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -40
          test "${PIPESTATUS[0]}" = 0
          ls "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/"
        shell: bash

  # Test nativi su Mac Apple Silicon (FFmpeg arm64 incluso nell'app). Non blocca la Release:
  # i runner arm64 di GitHub a volte non sono disponibili.
  test-apple-silicon:
    runs-on: macos-15
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  release:
    # pubblica anche se una piattaforma fallisce, con i file disponibili
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
